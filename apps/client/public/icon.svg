  <rect x="96" y="136" width="320" height="240" rx="36" fill="#f3f0ff"/>
  <!-- Grand compartiment : une page, ses lignes de texte. -->
  <rect x="124" y="164" width="124" height="184" rx="18" fill="#d0bfff"/>
  <rect x="148" y="196" width="76" height="14" rx="7" fill="#7048e8"/>
  <rect x="148" y="226" width="76" height="14" rx="7" fill="#7048e8"/>
  <rect x="148" y="256" width="52" height="14" rx="7" fill="#7048e8"/>
  <!-- Petits compartiments. -->
  <rect x="268" y="164" width="120" height="82" rx="18" fill="#b197fc"/>
  <rect x="268" y="266" width="120" height="82" rx="18" fill="#e5dbff"/>
